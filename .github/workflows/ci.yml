name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_docker:
        description: Run the optional Docker image build job.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      release: ${{ steps.filter.outputs.release }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant path changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          files=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              mapfile -t files < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
            else
              mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
            fi
          fi

          docker=false
          release=false
          workflows=false
          for file in "${files[@]}"; do
            case "$file" in
              Dockerfile|.dockerignore|docker-compose.yml)
                docker=true
                ;;
              package.json|package-lock.json)
                docker=true
                release=true
                ;;
              .github/workflows/*)
                workflows=true
                release=true
                ;;
              .release-please-manifest.json|release-please-config.json)
                release=true
                ;;
            esac
          done

          {
            printf 'docker=%s\n' "$docker"
            printf 'release=%s\n' "$release"
            printf 'workflows=%s\n' "$workflows"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm run audit:moderate

      - name: Build
        run: npm run build

      - name: Run TypeScript tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Run Python tests
        run: PYTHONPATH=python python3 -m unittest discover -s python/tests

  tsx-smoke:
    name: Runtime smoke (tsx scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run runtime smoke checks
        run: npm run ci:runtime-smoke

  ui-smoke:
    name: UI smoke (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Run Playwright smoke tests
        run: npm run test:e2e

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 -color

  release-dry-run:
    name: Release dry run
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.release == 'true' }}
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 -color

      - name: Run release-please dry run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_BRANCH: ${{ github.base_ref || 'main' }}
        run: |
          node node_modules/release-please/build/src/bin/release-please.js release-pr \
            --token="$GITHUB_TOKEN" \
            --repo-url="$GITHUB_REPOSITORY" \
            --target-branch="$TARGET_BRANCH" \
            --config-file=release-please-config.json \
            --manifest-file=.release-please-manifest.json \
            --dry-run

  docker-runtime-smoke:
    name: Docker runtime smoke
    runs-on: ubuntu-latest
    needs:
      - changes
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.run_docker) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:docker')) ||
        needs.changes.outputs.docker == 'true'
      }}

    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t sports-projector:ci .

      - name: Run Docker container smoke checks
        run: |
          set -euo pipefail

          container_id="$(docker run -d \
            -p 18082:8080 \
            -e SPORTS_PROJECTOR_HISTORICAL_REFRESH_ENABLED=false \
            -e SPORTS_PROJECTOR_LIVE_TRACKING_ENABLED=false \
            sports-projector:ci)"

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs "$container_id" || true
            fi
            docker rm -f "$container_id" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          ready=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:18082/ -o /tmp/sports-projector-root.html; then
              ready=true
              break
            fi
            sleep 1
          done

          if [ "$ready" != "true" ]; then
            echo "Container did not become ready."
            exit 1
          fi

          grep -q "Sports Projector" /tmp/sports-projector-root.html
          curl -fsS http://127.0.0.1:18082/api/settings -o /tmp/sports-projector-settings.json
          node -e "const fs = require('fs'); const payload = JSON.parse(fs.readFileSync('/tmp/sports-projector-settings.json', 'utf8')); if (!payload.settings || !payload.defaults) throw new Error('Unexpected settings payload');"

          trap - EXIT
          docker rm -f "$container_id" >/dev/null
