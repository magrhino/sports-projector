name: CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_docker:
        description: Run the optional Docker image build job.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
      workflows: ${{ steps.filter.outputs.workflows }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect relevant path changes
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail

          files=()
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            mapfile -t files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          elif [[ "$EVENT_NAME" == "push" ]]; then
            if [[ -n "$BEFORE_SHA" && ! "$BEFORE_SHA" =~ ^0+$ ]]; then
              mapfile -t files < <(git diff --name-only "$BEFORE_SHA" "$HEAD_SHA")
            else
              mapfile -t files < <(git diff-tree --no-commit-id --name-only -r "$HEAD_SHA")
            fi
          fi

          docker=false
          workflows=false
          for file in "${files[@]}"; do
            case "$file" in
              Dockerfile|.dockerignore|docker-compose.yml|package.json|package-lock.json)
                docker=true
                ;;
              .github/workflows/*)
                workflows=true
                ;;
            esac
          done

          {
            printf 'docker=%s\n' "$docker"
            printf 'workflows=%s\n' "$workflows"
          } >> "$GITHUB_OUTPUT"

  validate:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: 24
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Audit Node dependencies
        run: npm run audit:moderate

      - name: Build
        run: npm run build

      - name: Run TypeScript tests
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"

      - name: Run Python tests
        run: PYTHONPATH=python python3 -m unittest discover -s python/tests

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest
    needs:
      - changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.workflows == 'true' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Run actionlint
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint@sha256:9d36088643581e728c969f35141f88139fec77280b2be23c1f66f8e40e1025e7 -color

  docker-build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs:
      - changes
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' && inputs.run_docker) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:docker')) ||
        needs.changes.outputs.docker == 'true'
      }}

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t sports-projector:ci .
